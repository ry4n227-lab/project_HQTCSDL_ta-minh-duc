services:
  postgres:
    image: postgres:16-alpine
    container_name: octapoint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: octapoint
      POSTGRES_PASSWORD: octapoint
      POSTGRES_DB: octapoint
    ports:
      - "5432:5432"
    volumes:
      - octapoint_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octapoint -d octapoint"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  octapoint_pgdata:
